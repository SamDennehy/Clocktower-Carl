<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clocktower Carl Grimoire</title>
        <link rel="stylesheet" id="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
     <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='carl.ico') }}">
</head>
<body>
    <nav class="page-navigation" aria-label="Page navigation">
        <button type="button" onclick="window.location.href='/'">Grimoire</button>
        <button type="button" onclick="window.location.href='/script'">Script</button>
        <button type="button" onclick="window.location.href='/dashboard'">Dashboard</button>
        <!-- <button type="button" onclick="window.location.href='{{ url_for("log_stat_reminder") }}'">Log Stats Reminder</button> -->
    </nav>
    <main class="grimoire-shell">
        <section class="timer" aria-labelledby="timer-heading">
            <audio id="chime-audio">
                <source src="{{ url_for('static', filename='chimes.mp3') }}" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <audio id="screaming-audio">
                <source src="{{ url_for('static', filename='screaming.mp3') }}" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <p id="watching-message" class="watching-message">CARL IS WATCHING</p>
            <div class="timer-carl-stage">
                <div id="timer-hats" class="timer-hats" aria-hidden="true"></div>
                <div class="timer-carl">
                    <img class="timer-carl-image timer-carl-image-one" src="{{ url_for('static', filename='carl.png') }}" alt="">
                    <img class="timer-carl-image timer-carl-image-two" src="{{ url_for('static', filename='carl2.png') }}" alt="">
                    <img class="timer-carl-image timer-carl-image-three" src="{{ url_for('static', filename='carl3.png') }}" alt="">
                    <img class="timer-carl-crazy" src="{{ url_for('static', filename='carlcrazy.png') }}" alt="">
                </div>
            </div>
            <div class="timer-content">
                <p class="timer-label" id="timer-heading">TIME REMAINING</p>
                <p id="timer-display" aria-live="polite">0m 0s</p>
            </div>
            <form action="#" method="POST" id="timer-form">
                <label for="timer-duration">Set Timer (in seconds):</label>
                <input type="number" id="timer-duration" name="duration" min="1" required>
                <button type="submit">Set Timer</button>
                <button type="button" id="toggle-audio-button">Audio On</button>
                <button type="button" id="toggle-screaming-button">Screaming On</button>
            </form>
        </section>

        <section class="seating-panel" aria-labelledby="seating-heading">
            <ol id="player-seating" class="player-seating" aria-live="polite"></ol>
            <form id="seating-form">
                <label for="player-names">Players</label>
                <br>
                <div class="seating-heading-row">
                    <div>
                        <p class="timer-label" id="seating-heading">PLAYER ORDER</p>
                        <p class="seating-help">Enter names clockwise, separated by commas.</p>
                        <p class="seating-help">For travelers, add "[T]" beside the name of each traveler.</p>
                    </div>
                </div>
                <input type="text" id="player-names" name="players" autocomplete="off" placeholder="Dean,Sam,Ferdia[T],Seán..." required>
                <button type="submit">Display Seats</button>
            </form>
        </section>
    </main>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
